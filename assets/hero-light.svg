<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Abdullah Al Meyad (@meyadstack) developer profile hero card">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="borderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wordmarkLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="48%" stop-color="#0369a1"/>
      <stop offset="80%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shimmerLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyanLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigoLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmeraldLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#64748b" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="cardClipLight">
      <rect x="4" y="4" width="1192" height="372" rx="20"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      @keyframes auroraDrift {
        0%, 100% { opacity: 0.85; transform: translate(0px, 0px); }
        50% { opacity: 1; transform: translate(12px, -8px); }
      }
      .pulse-dot { animation: pulseDot 2.4s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1.15s steps(1, end) infinite; }
      .aurora-drift { animation: auroraDrift 9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot, .cursor, .aurora-drift { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClipLight)">
    <rect x="4" y="4" width="1192" height="372" rx="20" fill="url(#bgLight)"/>
    <rect x="4" y="4" width="1192" height="372" fill="url(#dotGridLight)"/>

    <g class="aurora-drift">
      <ellipse cx="980" cy="85" rx="340" ry="180" fill="url(#glowCyanLight)"/>
      <ellipse cx="520" cy="310" rx="360" ry="180" fill="url(#glowIndigoLight)"/>
      <ellipse cx="180" cy="95" rx="260" ry="160" fill="url(#glowEmeraldLight)"/>
    </g>

    <!-- Top bar -->
    <circle cx="54" cy="36" r="4.5" fill="#cbd5e1"/>
    <circle cx="70" cy="36" r="4.5" fill="#cbd5e1"/>
    <circle cx="86" cy="36" r="4.5" fill="#cbd5e1"/>
    <text x="104" y="40" class="mono" font-size="12.5" fill="#64748b">~/github/meyadstack/README.md</text>

    <rect x="946" y="22" width="206" height="28" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="966" cy="36" r="4" fill="#059669" class="pulse-dot"/>
    <text x="980" y="40" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#065f46">BUILDING IN PUBLIC</text>

    <!-- Left terminal card -->
    <rect x="48" y="72" width="310" height="254" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M48 86 A14 14 0 0 1 62 72 H344 A14 14 0 0 1 358 86 V106 H48 Z" fill="#f1f5f9"/>
    <line x1="48" y1="106" x2="358" y2="106" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="68" cy="89" r="4" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="82" cy="89" r="4" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="96" cy="89" r="4" fill="#34d399" fill-opacity="0.85"/>
    <text x="203" y="93" text-anchor="middle" class="mono" font-size="11.5" fill="#64748b">identity.sh</text>

    <text x="68" y="134" class="mono" font-size="13" fill="#0284c7">$ whoami</text>
    <text x="82" y="156" class="mono" font-size="13" fill="#0f172a">abdullah_al_meyad</text>

    <text x="68" y="186" class="mono" font-size="13" fill="#4f46e5">$ handle</text>
    <text x="82" y="208" class="mono" font-size="13" fill="#0f172a">@meyadstack</text>

    <text x="68" y="238" class="mono" font-size="13" fill="#059669">$ focus</text>
    <text x="82" y="260" class="mono" font-size="13" fill="#0f172a">shipping useful work</text>

    <text x="68" y="294" class="mono" font-size="13" fill="#64748b">$ status</text>
    <text x="136" y="294" class="mono" font-size="13" fill="#0369a1">ready</text>
    <rect x="182" y="282" width="8" height="15" rx="1.5" fill="#0284c7" class="cursor"/>

    <!-- Right hero typography -->
    <text x="398" y="98" class="mono" font-size="12" font-weight="600" letter-spacing="2" fill="#0369a1">DEVELOPER PROFILE · @MEYADSTACK</text>

    <!-- 3D layered depth wordmark -->
    <text x="401" y="170" class="sans" font-size="64" font-weight="800" letter-spacing="3" fill="#6366f1" fill-opacity="0.16">MEYADSTACK</text>
    <text x="399" y="168" class="sans" font-size="64" font-weight="800" letter-spacing="3" fill="#0284c7" fill-opacity="0.14">MEYADSTACK</text>
    <text x="396" y="166" class="sans" font-size="64" font-weight="800" letter-spacing="3" fill="url(#wordmarkLight)">MEYADSTACK</text>

    <text x="398" y="204" class="sans" font-size="22" font-weight="600" fill="#0f172a">Abdullah Al Meyad</text>
    <text x="398" y="236" class="sans" font-size="16" fill="#475569">Building useful software, clean interfaces, and dependable tools.</text>

    <!-- Capability pills -->
    <rect x="398" y="272" width="188" height="36" rx="18" fill="#ffffff" fill-opacity="0.92" stroke="#0284c7" stroke-opacity="0.32" stroke-width="1"/>
    <text x="492" y="294.5" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#0369a1">Product Engineering</text>

    <rect x="602" y="272" width="188" height="36" rx="18" fill="#ffffff" fill-opacity="0.92" stroke="#4f46e5" stroke-opacity="0.32" stroke-width="1"/>
    <text x="696" y="294.5" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#4338ca">Clean Architecture</text>

    <rect x="806" y="272" width="188" height="36" rx="18" fill="#ffffff" fill-opacity="0.92" stroke="#059669" stroke-opacity="0.32" stroke-width="1"/>
    <text x="900" y="294.5" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#047857">Open Source</text>

    <!-- Bottom accent bar -->
    <rect x="48" y="348" width="1104" height="2" rx="1" fill="url(#shimmerLight)"/>
  </g>

  <rect x="4" y="4" width="1192" height="372" rx="20" fill="none" stroke="url(#borderLight)" stroke-width="1.25"/>
</svg>
