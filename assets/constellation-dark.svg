<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img" aria-label="Project Constellation: A universe of work">
  <defs>
    <linearGradient id="cbg_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="cbdr_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.42"/>
    </linearGradient>
    <radialGradient id="hubC_d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubV_d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubE_d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes arcFlow { from { stroke-dashoffset: 320; } to { stroke-dashoffset: 0; } }
      .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
      .orbit-c { transform-origin: 500px 196px; animation: spinSlow 36s linear infinite; }
      .orbit-l { transform-origin: 205px 190px; animation: spinRev 28s linear infinite; }
      .orbit-r { transform-origin: 795px 190px; animation: spinSlow 30s linear infinite; }
      .arc-flow { stroke-dasharray: 8 10; animation: arcFlow 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .twinkle, .orbit-c, .orbit-l, .orbit-r, .arc-flow { animation: none; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="382" rx="18" fill="url(#cbg_d)" stroke="url(#cbdr_d)" stroke-width="1.2"/>

  <!-- Starfield -->
  <g>
    <circle cx="78" cy="96" r="1.3" fill="#e2e8f0" fill-opacity="0.7" class="twinkle" style="animation-delay:0.0s"/>
    <circle cx="132" cy="68" r="1.0" fill="#e2e8f0" fill-opacity="0.5" class="twinkle" style="animation-delay:0.6s"/>
    <circle cx="176" cy="122" r="1.5" fill="#e2e8f0" fill-opacity="0.8" class="twinkle" style="animation-delay:1.2s"/>
    <circle cx="285" cy="86" r="1.1" fill="#e2e8f0" fill-opacity="0.6" class="twinkle" style="animation-delay:0.4s"/>
    <circle cx="354" cy="118" r="1.4" fill="#e2e8f0" fill-opacity="0.7" class="twinkle" style="animation-delay:1.8s"/>
    <circle cx="420" cy="74" r="1.0" fill="#e2e8f0" fill-opacity="0.5" class="twinkle" style="animation-delay:0.9s"/>
    <circle cx="588" cy="82" r="1.5" fill="#e2e8f0" fill-opacity="0.75" class="twinkle" style="animation-delay:1.5s"/>
    <circle cx="656" cy="112" r="1.1" fill="#e2e8f0" fill-opacity="0.5" class="twinkle" style="animation-delay:0.3s"/>
    <circle cx="722" cy="70" r="1.3" fill="#e2e8f0" fill-opacity="0.65" class="twinkle" style="animation-delay:2.0s"/>
    <circle cx="845" cy="92" r="1.4" fill="#e2e8f0" fill-opacity="0.8" class="twinkle" style="animation-delay:0.7s"/>
    <circle cx="918" cy="128" r="1.1" fill="#e2e8f0" fill-opacity="0.5" class="twinkle" style="animation-delay:1.3s"/>
    <circle cx="94" cy="286" r="1.2" fill="#e2e8f0" fill-opacity="0.6" class="twinkle" style="animation-delay:1.1s"/>
    <circle cx="165" cy="316" r="1.4" fill="#e2e8f0" fill-opacity="0.7" class="twinkle" style="animation-delay:0.2s"/>
    <circle cx="326" cy="298" r="1.1" fill="#e2e8f0" fill-opacity="0.55" class="twinkle" style="animation-delay:1.7s"/>
    <circle cx="412" cy="326" r="1.3" fill="#e2e8f0" fill-opacity="0.65" class="twinkle" style="animation-delay:0.5s"/>
    <circle cx="612" cy="314" r="1.2" fill="#e2e8f0" fill-opacity="0.6" class="twinkle" style="animation-delay:1.9s"/>
    <circle cx="696" cy="292" r="1.5" fill="#e2e8f0" fill-opacity="0.75" class="twinkle" style="animation-delay:0.8s"/>
    <circle cx="854" cy="312" r="1.2" fill="#e2e8f0" fill-opacity="0.6" class="twinkle" style="animation-delay:1.4s"/>
    <circle cx="926" cy="274" r="1.4" fill="#e2e8f0" fill-opacity="0.7" class="twinkle" style="animation-delay:0.1s"/>
    <circle cx="48" cy="198" r="1.1" fill="#e2e8f0" fill-opacity="0.5" class="twinkle" style="animation-delay:1.6s"/>
    <circle cx="952" cy="196" r="1.2" fill="#e2e8f0" fill-opacity="0.55" class="twinkle" style="animation-delay:0.4s"/>
  </g>

  <!-- Header -->
  <text x="36" y="38" class="mono" font-size="11" font-weight="600" letter-spacing="1.8" fill="#7dd3fc">PROJECT CONSTELLATION</text>
  <text x="36" y="66" class="sans" font-size="22" font-weight="700" fill="#f8fafc">A universe of work</text>
  <rect x="782" y="24" width="182" height="28" rx="14" fill="#0d1424" stroke="#23304a" stroke-width="1"/>
  <text x="873" y="42" text-anchor="middle" class="mono" font-size="10.8" fill="#8fa0b8">3 PUBLIC REPOSITORIES</text>
  <line x1="36" y1="82" x2="964" y2="82" stroke="#23304a" stroke-dasharray="4 5" stroke-opacity="0.65"/>

  <!-- Connecting constellation arcs -->
  <path d="M 205 190 Q 352 130, 500 196" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M 205 190 Q 352 130, 500 196" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5" class="arc-flow"/>
  <path d="M 500 196 Q 648 130, 795 190" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M 500 196 Q 648 130, 795 190" fill="none" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5" class="arc-flow"/>

  <!-- Left Planet: Voxban -->
  <circle cx="205" cy="190" r="88" fill="url(#hubV_d)"/>
  <g class="orbit-l">
    <circle cx="205" cy="190" r="56" fill="none" stroke="#a78bfa" stroke-opacity="0.38" stroke-dasharray="4 6" stroke-width="1.2"/>
    <circle cx="261" cy="190" r="3.5" fill="#a78bfa"/>
  </g>
  <circle cx="205" cy="190" r="38" fill="#0d1424" stroke="#a78bfa" stroke-width="1.8"/>
  <!-- Custom crisp voice-wave vector icon -->
  <rect x="190" y="184" width="3.5" height="12" rx="1.75" fill="#c4b5fd"/>
  <rect x="197" y="177" width="3.5" height="26" rx="1.75" fill="#a78bfa"/>
  <rect x="204" y="172" width="3.5" height="36" rx="1.75" fill="#7dd3fc"/>
  <rect x="211" y="179" width="3.5" height="22" rx="1.75" fill="#a78bfa"/>
  <rect x="218" y="185" width="3.5" height="10" rx="1.75" fill="#c4b5fd"/>

  <text x="205" y="274" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#f8fafc">Voxban</text>
  <text x="205" y="294" text-anchor="middle" class="mono" font-size="11" fill="#c4b5fd">Kotlin · Rust · TypeScript</text>
  <text x="205" y="313" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">Voice-first app in 12 languages</text>

  <!-- Center Primary Star: agent-evaluation-system -->
  <circle cx="500" cy="196" r="112" fill="url(#hubC_d)"/>
  <g class="orbit-c">
    <circle cx="500" cy="196" r="74" fill="none" stroke="#38bdf8" stroke-opacity="0.38" stroke-dasharray="5 7" stroke-width="1.3"/>
    <circle cx="574" cy="196" r="4" fill="#38bdf8"/>
    <circle cx="426" cy="196" r="3" fill="#34d399"/>
  </g>
  <circle cx="500" cy="196" r="54" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="500" cy="196" r="46" fill="#0d1424" stroke="#38bdf8" stroke-width="2"/>
  <!-- Custom crisp agent-graph vector icon -->
  <line x1="486" y1="186" x2="500" y2="206" stroke="#38bdf8" stroke-width="2"/>
  <line x1="514" y1="186" x2="500" y2="206" stroke="#38bdf8" stroke-width="2"/>
  <line x1="486" y1="186" x2="514" y2="186" stroke="#34d399" stroke-width="1.6" stroke-dasharray="3 2"/>
  <circle cx="486" cy="186" r="5.5" fill="#7dd3fc"/>
  <circle cx="514" cy="186" r="5.5" fill="#c4b5fd"/>
  <circle cx="500" cy="206" r="6.5" fill="#34d399"/>

  <text x="500" y="295" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f8fafc">agent-evaluation-system</text>
  <text x="500" y="315" text-anchor="middle" class="mono" font-size="11" fill="#7dd3fc">Python · LangChain · DeepEval</text>
  <text x="500" y="334" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">7 metrics · 7 golden refund scenarios</text>

  <!-- Right Planet: meyadstack -->
  <circle cx="795" cy="190" r="88" fill="url(#hubE_d)"/>
  <g class="orbit-r">
    <circle cx="795" cy="190" r="56" fill="none" stroke="#34d399" stroke-opacity="0.38" stroke-dasharray="4 6" stroke-width="1.2"/>
    <circle cx="795" cy="134" r="3.5" fill="#34d399"/>
  </g>
  <circle cx="795" cy="190" r="38" fill="#0d1424" stroke="#34d399" stroke-width="1.8"/>
  <!-- Custom crisp terminal prompt vector icon -->
  <path d="M 782 183 L 791 190 L 782 197" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="796" y1="197" x2="809" y2="197" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>

  <text x="795" y="274" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#f8fafc">meyadstack</text>
  <text x="795" y="294" text-anchor="middle" class="mono" font-size="11" fill="#6ee7b7">SVG · Dark &amp; Light Skin</text>
  <text x="795" y="313" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">Animated living GitHub profile</text>

  <!-- Footer meta -->
  <text x="36" y="366" class="mono" font-size="10.2" fill="#52637d">ORBITAL MAP · PUBLIC REPOSITORIES</text>
  <text x="964" y="366" text-anchor="end" class="mono" font-size="10.2" fill="#52637d">github.com/meyadstack</text>
</svg>
