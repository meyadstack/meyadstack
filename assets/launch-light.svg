<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-label="Project Launch Sequence and Delivery Pipeline">
  <defs>
    <linearGradient id="lbg_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="lbdr_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="beam_l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseRing { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.3; } }
      @keyframes beamRun { from { stroke-dashoffset: 480; } to { stroke-dashoffset: 0; } }
      .pring { animation: pulseRing 2.6s ease-in-out infinite; }
      .brun { stroke-dasharray: 44 180; animation: beamRun 6s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .pring, .brun { animation: none; } }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="352" rx="18" fill="url(#lbg_l)" stroke="url(#lbdr_l)" stroke-width="1.2"/>

  <!-- Header -->
  <text x="36" y="36" class="mono" font-size="11" font-weight="600" letter-spacing="1.8" fill="#6d28d9">PROJECT LAUNCH SEQUENCE</text>
  <text x="36" y="62" class="sans" font-size="21" font-weight="700" fill="#0f172a">Where the work went next</text>
  <text x="964" y="56" text-anchor="end" class="mono" font-size="10.8" fill="#475569">3 SHIPPED RELEASES · NOV 2026</text>

  <!-- Main cosmic timeline track (y=176) -->
  <line x1="90" y1="176" x2="910" y2="176" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="176" x2="820" y2="176" stroke="url(#beam_l)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="180" y1="176" x2="820" y2="176" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.8" stroke-linecap="round" class="brun"/>

  <!-- Node 1 (Left, above track): meyadstack -->
  <circle cx="180" cy="176" r="18" fill="#059669" fill-opacity="0.14" class="pring"/>
  <circle cx="180" cy="176" r="9" fill="#ffffff" stroke="#059669" stroke-width="2.6"/>
  <circle cx="180" cy="176" r="3.5" fill="#059669"/>
  <line x1="180" y1="158" x2="180" y2="146" stroke="#059669" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="180" y="96" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#047857">01 / NOV 22, 2026</text>
  <text x="180" y="117" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">meyadstack</text>
  <text x="180" y="135" text-anchor="middle" class="sans" font-size="11.5" fill="#475569">Custom animated SVG profile skin</text>

  <!-- Node 2 (Center, below track): Voxban -->
  <circle cx="500" cy="176" r="18" fill="#7c3aed" fill-opacity="0.14" class="pring"/>
  <circle cx="500" cy="176" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2.6"/>
  <circle cx="500" cy="176" r="3.5" fill="#7c3aed"/>
  <line x1="500" y1="194" x2="500" y2="206" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="500" y="220" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#6d28d9">02 / NOV 23, 2026</text>
  <text x="500" y="241" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">Voxban</text>
  <text x="500" y="259" text-anchor="middle" class="sans" font-size="11.5" fill="#475569">Voice-first Android &amp; Desktop OS (Kotlin · Rust · TS)</text>

  <!-- Node 3 (Right, above track): agent-evaluation-system -->
  <circle cx="820" cy="176" r="18" fill="#0284c7" fill-opacity="0.14" class="pring"/>
  <circle cx="820" cy="176" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="2.6"/>
  <circle cx="820" cy="176" r="3.5" fill="#0284c7"/>
  <line x1="820" y1="158" x2="820" y2="146" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="820" y="96" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#0369a1">03 / NOV 26, 2026</text>
  <text x="820" y="117" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#0f172a">agent-evaluation-system</text>
  <text x="820" y="135" text-anchor="middle" class="sans" font-size="11.5" fill="#475569">LangChain refund agent + 7 DeepEval metrics</text>

  <!-- Bottom 5-step delivery ribbon -->
  <rect x="36" y="284" width="176" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50" y="302" class="mono" font-size="10" font-weight="700" fill="#0284c7">STEP 01</text><text x="50" y="319" class="sans" font-size="12" font-weight="600" fill="#334155">Discovery &amp; Audit</text><rect x="224" y="284" width="176" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="238" y="302" class="mono" font-size="10" font-weight="700" fill="#7c3aed">STEP 02</text><text x="238" y="319" class="sans" font-size="12" font-weight="600" fill="#334155">Architecture</text><rect x="412" y="284" width="176" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="426" y="302" class="mono" font-size="10" font-weight="700" fill="#059669">STEP 03</text><text x="426" y="319" class="sans" font-size="12" font-weight="600" fill="#334155">Agent Build</text><rect x="600" y="284" width="176" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="614" y="302" class="mono" font-size="10" font-weight="700" fill="#d97706">STEP 04</text><text x="614" y="319" class="sans" font-size="12" font-weight="600" fill="#334155">QA &amp; DeepEval</text><rect x="788" y="284" width="176" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="802" y="302" class="mono" font-size="10" font-weight="700" fill="#e11d48">STEP 05</text><text x="802" y="319" class="sans" font-size="12" font-weight="600" fill="#334155">Handover</text>
</svg>
