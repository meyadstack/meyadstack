<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img" aria-label="Footer call to action for @meyadstack">
  <defs>
    <linearGradient id="footBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="footBorderDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="footGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="footClipDark">
      <rect x="4" y="4" width="1192" height="140" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .foot-glow { animation: pulseGlow 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .foot-glow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#footClipDark)">
    <rect x="4" y="4" width="1192" height="140" rx="18" fill="url(#footBgDark)"/>
    <ellipse cx="600" cy="74" rx="440" ry="110" fill="url(#footGlowDark)" class="foot-glow"/>

    <text x="600" y="52" text-anchor="middle" class="sans" font-size="23" font-weight="700" fill="#f8fafc">Let's build systems that run your business.</text>
    <text x="600" y="83" text-anchor="middle" class="sans" font-size="15" fill="#94a3b8">AI &amp; Automation Expert · GoHighLevel Certified Admin · Always available (EST)</text>

    <rect x="370" y="100" width="460" height="26" rx="13" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="600" y="117" text-anchor="middle" class="mono" font-size="12.5" fill="#7dd3fc">@meyadstack · abdullah-al-meyad.netlify.app</text>
  </g>

  <rect x="4" y="4" width="1192" height="140" rx="18" fill="none" stroke="url(#footBorderDark)" stroke-width="1.2"/>
</svg>
