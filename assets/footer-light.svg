  <text x="500" y="84" text-anchor="middle" class="sans" font-size="27" font-weight="800" fill="url(#ftxt_l)">Let's build autonomous systems that run 24/7.</text>
  <text x="500" y="112" text-anchor="middle" class="mono" font-size="11.8" fill="#475569">Abdullah Al Meyad (@meyadstack) · Backspace International LTD · 30+ hrs/wk EST</text>
  <rect x="140" y="132" width="720" height="2" rx="1" fill="url(#fbar_l)"/>
