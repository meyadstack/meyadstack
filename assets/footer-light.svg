<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img" aria-label="Footer call to action for @meyadstack">
  <defs>
    <linearGradient id="footBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="footBorderLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="footGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="footClipLight">
      <rect x="4" y="4" width="1192" height="140" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .foot-glow { animation: pulseGlow 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .foot-glow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#footClipLight)">
    <rect x="4" y="4" width="1192" height="140" rx="18" fill="url(#footBgLight)"/>
    <ellipse cx="600" cy="74" rx="440" ry="110" fill="url(#footGlowLight)" class="foot-glow"/>

    <text x="600" y="52" text-anchor="middle" class="sans" font-size="23" font-weight="700" fill="#0f172a">Let's build systems that run your business.</text>
    <text x="600" y="83" text-anchor="middle" class="sans" font-size="15" fill="#475569">AI &amp; Automation Expert · GoHighLevel Certified Admin · Always available (EST)</text>

    <rect x="370" y="100" width="460" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="600" y="117" text-anchor="middle" class="mono" font-size="12.5" fill="#0369a1">@meyadstack · abdullah-al-meyad.netlify.app</text>
  </g>

  <rect x="4" y="4" width="1192" height="140" rx="18" fill="none" stroke="url(#footBorderLight)" stroke-width="1.2"/>
</svg>
