<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-label="Project Launch Sequence and Delivery Pipeline">
  <defs>
    <linearGradient id="lbg_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="lbdr_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="beam_d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseRing { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.3; } }
      @keyframes beamRun { from { stroke-dashoffset: 480; } to { stroke-dashoffset: 0; } }
      .pring { animation: pulseRing 2.6s ease-in-out infinite; }
      .brun { stroke-dasharray: 44 180; animation: beamRun 6s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .pring, .brun { animation: none; } }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="352" rx="18" fill="url(#lbg_d)" stroke="url(#lbdr_d)" stroke-width="1.2"/>

  <!-- Header -->
  <text x="36" y="36" class="mono" font-size="11" font-weight="600" letter-spacing="1.8" fill="#c4b5fd">PROJECT LAUNCH SEQUENCE</text>
  <text x="36" y="62" class="sans" font-size="21" font-weight="700" fill="#f8fafc">Where the work went next</text>
  <text x="964" y="56" text-anchor="end" class="mono" font-size="10.8" fill="#8fa0b8">3 SHIPPED RELEASES · NOV 2026</text>

  <!-- Main cosmic timeline track (y=176) -->
  <line x1="90" y1="176" x2="910" y2="176" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="176" x2="820" y2="176" stroke="url(#beam_d)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="180" y1="176" x2="820" y2="176" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.8" stroke-linecap="round" class="brun"/>

  <!-- Node 1 (Left, above track): meyadstack -->
  <circle cx="180" cy="176" r="18" fill="#34d399" fill-opacity="0.14" class="pring"/>
  <circle cx="180" cy="176" r="9" fill="#0d1424" stroke="#34d399" stroke-width="2.6"/>
  <circle cx="180" cy="176" r="3.5" fill="#34d399"/>
  <line x1="180" y1="158" x2="180" y2="146" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="180" y="96" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#6ee7b7">01 / NOV 22, 2026</text>
  <text x="180" y="117" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#f8fafc">meyadstack</text>
  <text x="180" y="135" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">Custom animated SVG profile skin</text>

  <!-- Node 2 (Center, below track): Voxban -->
  <circle cx="500" cy="176" r="18" fill="#a78bfa" fill-opacity="0.14" class="pring"/>
  <circle cx="500" cy="176" r="9" fill="#0d1424" stroke="#a78bfa" stroke-width="2.6"/>
  <circle cx="500" cy="176" r="3.5" fill="#a78bfa"/>
  <line x1="500" y1="194" x2="500" y2="206" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="500" y="220" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#c4b5fd">02 / NOV 23, 2026</text>
  <text x="500" y="241" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#f8fafc">Voxban</text>
  <text x="500" y="259" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">Voice-first Android &amp; Desktop OS (Kotlin · Rust · TS)</text>

  <!-- Node 3 (Right, above track): agent-evaluation-system -->
  <circle cx="820" cy="176" r="18" fill="#38bdf8" fill-opacity="0.14" class="pring"/>
  <circle cx="820" cy="176" r="9" fill="#0d1424" stroke="#38bdf8" stroke-width="2.6"/>
  <circle cx="820" cy="176" r="3.5" fill="#38bdf8"/>
  <line x1="820" y1="158" x2="820" y2="146" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="820" y="96" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#7dd3fc">03 / NOV 26, 2026</text>
  <text x="820" y="117" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#f8fafc">agent-evaluation-system</text>
  <text x="820" y="135" text-anchor="middle" class="sans" font-size="11.5" fill="#8fa0b8">LangChain refund agent + 7 DeepEval metrics</text>

  <!-- Bottom 5-step delivery ribbon -->
  <rect x="36" y="284" width="176" height="44" rx="10" fill="#0d1424" stroke="#23304a" stroke-width="1"/><text x="50" y="302" class="mono" font-size="10" font-weight="700" fill="#38bdf8">STEP 01</text><text x="50" y="319" class="sans" font-size="12" font-weight="600" fill="#cbd5e1">Discovery &amp; Audit</text><rect x="224" y="284" width="176" height="44" rx="10" fill="#0d1424" stroke="#23304a" stroke-width="1"/><text x="238" y="302" class="mono" font-size="10" font-weight="700" fill="#a78bfa">STEP 02</text><text x="238" y="319" class="sans" font-size="12" font-weight="600" fill="#cbd5e1">Architecture</text><rect x="412" y="284" width="176" height="44" rx="10" fill="#0d1424" stroke="#23304a" stroke-width="1"/><text x="426" y="302" class="mono" font-size="10" font-weight="700" fill="#34d399">STEP 03</text><text x="426" y="319" class="sans" font-size="12" font-weight="600" fill="#cbd5e1">Agent Build</text><rect x="600" y="284" width="176" height="44" rx="10" fill="#0d1424" stroke="#23304a" stroke-width="1"/><text x="614" y="302" class="mono" font-size="10" font-weight="700" fill="#fbbf24">STEP 04</text><text x="614" y="319" class="sans" font-size="12" font-weight="600" fill="#cbd5e1">QA &amp; DeepEval</text><rect x="788" y="284" width="176" height="44" rx="10" fill="#0d1424" stroke="#23304a" stroke-width="1"/><text x="802" y="302" class="mono" font-size="10" font-weight="700" fill="#fb7185">STEP 05</text><text x="802" y="319" class="sans" font-size="12" font-weight="600" fill="#cbd5e1">Handover</text>
</svg>
