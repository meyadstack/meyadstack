<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Core expertise: AI Voice &amp; Chat Agents, GoHighLevel Systems, and Workflow Automation">
  <defs>
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#11192e"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes softPulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      .accent-bar { animation: softPulse 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .accent-bar { animation: none; }
      }
    </style>
  </defs>

  <!-- Card 1: Voice & Chat AI -->
  <rect x="16" y="10" width="376" height="180" rx="16" fill="url(#cardBgDark)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="44" y="24" width="320" height="2.5" rx="1.25" fill="#22d3ee" class="accent-bar"/>
  <text x="44" y="54" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#7dd3fc">01 · VOICE &amp; CHAT AI</text>
  <rect x="328" y="36" width="36" height="36" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M337 54 H340 L343 46 L346 62 L349 49 L352 57 L355 54" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="98" class="sans" font-size="20" font-weight="700" fill="#f8fafc">AI Voice &amp; Chat Agents</text>
  <text x="44" y="130" class="sans" font-size="14" fill="#94a3b8">Production 24/7 agents on VAPI,</text>
  <text x="44" y="152" class="sans" font-size="14" fill="#94a3b8">Retell AI, ElevenLabs &amp; Bland AI.</text>

  <!-- Card 2: GHL Architecture -->
  <rect x="412" y="10" width="376" height="180" rx="16" fill="url(#cardBgDark)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="440" y="24" width="320" height="2.5" rx="1.25" fill="#818cf8" class="accent-bar"/>
  <text x="440" y="54" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#a5b4fc">02 · GHL ARCHITECTURE</text>
  <rect x="724" y="36" width="36" height="36" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="733" y="45" width="7" height="7" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.6"/>
  <rect x="744" y="45" width="7" height="7" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.6"/>
  <rect x="733" y="56" width="7" height="7" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.6"/>
  <rect x="744" y="56" width="7" height="7" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.6"/>
  <text x="440" y="98" class="sans" font-size="20" font-weight="700" fill="#f8fafc">GoHighLevel Systems</text>
  <text x="440" y="130" class="sans" font-size="14" fill="#94a3b8">Certified Admin builds: CRMs,</text>
  <text x="440" y="152" class="sans" font-size="14" fill="#94a3b8">snapshots, pipelines &amp; A2P 10DLC.</text>

  <!-- Card 3: Orchestration -->
  <rect x="808" y="10" width="376" height="180" rx="16" fill="url(#cardBgDark)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="836" y="24" width="320" height="2.5" rx="1.25" fill="#34d399" class="accent-bar"/>
  <text x="836" y="54" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#6ee7b7">03 · ORCHESTRATION</text>
  <rect x="1120" y="36" width="36" height="36" rx="10" fill="#0f172a" stroke="#34d399" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="1132" cy="48" r="2.5" fill="none" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="1144" cy="54" r="2.5" fill="none" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="1132" cy="60" r="2.5" fill="none" stroke="#34d399" stroke-width="1.6"/>
  <path d="M1134.5 49 L1141.5 52.8 M1134.5 59 L1141.5 55.2" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <text x="836" y="98" class="sans" font-size="20" font-weight="700" fill="#f8fafc">Workflow Automation</text>
  <text x="836" y="130" class="sans" font-size="14" fill="#94a3b8">Multi-step n8n, Make &amp; Zapier</text>
  <text x="836" y="152" class="sans" font-size="14" fill="#94a3b8">pipelines with REST &amp; LLM APIs.</text>
</svg>
